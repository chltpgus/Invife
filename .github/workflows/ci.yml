name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
      - run: npm run build
      - run: npm run check:export

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lint, typecheck, test, build
        run: |
          set -euo pipefail
          if [[ ! -f backend/package.json ]]; then
            echo "backend/package.json 없음. 생기면 lint(있을 때), typecheck, test, build(있을 때)를 실행합니다."
            exit 0
          fi
          cd backend
          npm ci
          npm run lint --if-present
          npm run typecheck
          if node -e "const scripts=(require('./package.json').scripts)||{}; process.exit(scripts.test ? 0 : 1)"; then
            sudo apt-get update
            sudo apt-get install -y postgresql
            sudo service postgresql start
            if ! id ubuntu >/dev/null 2>&1; then
              sudo useradd --create-home --shell /bin/bash ubuntu
            fi
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN CREATE ROLE ubuntu WITH SUPERUSER LOGIN; EXCEPTION WHEN duplicate_object THEN ALTER ROLE ubuntu WITH SUPERUSER LOGIN; END \$\$;"
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN CREATE ROLE invife_app WITH LOGIN PASSWORD 'invife_app' NOINHERIT; EXCEPTION WHEN duplicate_object THEN ALTER ROLE invife_app WITH LOGIN PASSWORD 'invife_app' NOINHERIT; END \$\$;"
            sudo chown -R ubuntu:ubuntu .
            sudo -u ubuntu env PATH="$PATH" npm test
          fi
          npm run build --if-present
